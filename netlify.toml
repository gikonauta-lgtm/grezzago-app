[build]
  publish = "."
  functions = "netlify/functions"

# L'app chiama /api/rss: qui lo instrado sulla funzione Netlify.
[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
